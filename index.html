<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>inStudyChord</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Chord study trainer: chord name to keyboard and keyboard to chord name, including advanced jazz chords.">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StudyChord">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <h1>inStudyChord <span id="appVersion" class="ver"></span></h1>
      <div class="seg" role="tablist" aria-label="Direction">
        <button type="button" role="tab" data-mode="name2keys">Name &rarr; Keys</button>
        <button type="button" role="tab" data-mode="keys2name">Keys &rarr; Name</button>
        <button type="button" role="tab" data-mode="exercise">Exercise</button>
        <button type="button" role="tab" data-mode="free">Free</button>
        <button type="button" role="tab" data-mode="explore">Explore</button>
      </div>
      <button type="button" id="openSettings" class="ghost">Settings</button>
    </header>

    <main id="stage">
      <div id="history" class="history" aria-label="Last chords"></div>

      <section class="card">
        <button type="button" id="playBtn" class="play" aria-label="Play chord" title="Play the chord shown on the keyboard"><span aria-hidden="true">&#9834;</span> Play</button>
        <div id="chordName" class="chord-name" aria-live="polite"></div>
        <div id="chordLong" class="chord-long"></div>
      </section>

      <section class="picker" aria-label="Choose a chord">
        <div id="rootPicker" class="root-picker" role="group" aria-label="Root"></div>
        <div class="chord-picker">
          <button type="button" id="chordPrev" aria-label="Previous chord type">&lsaquo;</button>
          <select id="chordPicker" aria-label="Chord type"></select>
          <button type="button" id="chordNext" aria-label="Next chord type">&rsaquo;</button>
        </div>
      </section>

      <div class="status">
        <div class="bar"><i id="barFill"></i></div>
        <span id="statusText"></span>
      </div>

      <div class="kb-wrap"><svg id="keyboard" role="img" aria-label="Piano keyboard"></svg></div>
      <div id="legend" class="legend"></div>

      <section id="details" class="details" hidden>
        <div><span class="k">Notes</span><span id="dNotes"></span></div>
        <div><span class="k">Degrees</span><span id="dDegrees"></span></div>
        <div id="dAliasRow"><span class="k" id="dAliasLabel">Also written</span><span id="dAliases"></span></div>
        <div id="dSameRow"><span class="k" id="dSameLabel">Same notes as</span><span id="dSame"></span></div>
      </section>

      <div class="controls">
        <button type="button" id="pauseBtn" class="ghost">Pause</button>
        <button type="button" id="actionBtn" class="primary">Reveal now</button>
      </div>
    </main>
  </div>

  <dialog id="settings">
    <form method="dialog">
      <div class="dlg-head">
        <h2>Settings</h2>
        <button value="close" class="primary">Done</button>
      </div>

      <fieldset>
        <legend>Timing</legend>
        <label class="slider">Reveal after <output id="revealOut"></output>
          <input type="range" id="revealSec" min="0" max="30" step="1"></label>
        <label class="slider">Auto-next after reveal <output id="autoNextOut"></output>
          <input type="range" id="autoNextSec" min="0" max="30" step="1"></label>
      </fieldset>

      <fieldset>
        <legend>Chord groups <span id="poolInfo" class="muted"></span></legend>
        <div id="groupBoxes" class="checks"></div>
        <div class="row">
          <button type="button" id="groupsAll" class="ghost small">All</button>
          <button type="button" id="groupsNone" class="ghost small">None</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>Roots</legend>
        <div id="rootBoxes" class="checks roots"></div>
        <div class="row">
          <button type="button" id="rootsAll" class="ghost small">All</button>
          <button type="button" id="rootsNone" class="ghost small">None</button>
          <label class="inline">Accidentals
            <select id="accidentals">
              <option value="jazz">Jazz (D&flat; E&flat; F&sharp; A&flat; B&flat;)</option>
              <option value="flats">Flats</option>
              <option value="sharps">Sharps</option>
            </select></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Display &amp; sound</legend>
        <label class="check"><input type="checkbox" id="degreeLabels"> Colour-coded degree numbers on keys (R, &flat;3, &flat;7 &hellip;)</label>
        <label class="check"><input type="checkbox" id="noteNames"> Note names on keys</label>
        <label class="check"><input type="checkbox" id="colorBefore"> Keys &rarr; Name: show the colour-coded numbers before reveal (easier)</label>
        <label class="check"><input type="checkbox" id="fullVoicings"> Include the notes a chord usually leaves out (e.g. the 5th of a 9&flat;13). Off: they are left out and named under the chord</label>
        <label class="check"><input type="checkbox" id="exactVoicing"> Exercise: require the exact voicing (right octaves), not just the notes</label>
        <div class="row"><button type="button" id="clearHistory" class="ghost small">Clear chord history</button></div>
        <label class="check"><input type="checkbox" id="sound"> Auto-play the chord on reveal and when picking a chord</label>
      </fieldset>
    </form>
  </dialog>

  <noscript>inStudyChord needs JavaScript.</noscript>
  <script src="js/version.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
